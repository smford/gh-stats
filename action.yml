name: 'GitHub Stats SARIF'
description: 'Generate SRE and developer health statistics for PRs or repositories and publish them as SARIF code scanning results.'
author: 'smford'
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  target:
    description: 'Target scope to analyze: "pr", "repo", "release", "range", or "auto" (auto detects based on event)'
    required: false
    default: 'auto'
  base-ref:
    description: 'Base git reference for PR or release comparison (defaults to auto-detected previous tag in release mode, or base branch in PR mode)'
    required: false
    default: ''
  head-ref:
    description: 'Head git reference for PR or release comparison (defaults to HEAD or latest tag in release mode)'
    required: false
    default: 'HEAD'
  output:
    description: 'File path for the generated SARIF report'
    required: false
    default: 'gh-stats.sarif'
  commit-limit:
    description: 'Number of recent commits to analyze for hotspot detection in repo mode'
    required: false
    default: '200'
  upload-sarif:
    description: 'Whether to automatically upload the SARIF report to GitHub Code Scanning'
    required: false
    default: 'true'
  category:
    description: 'SARIF category name for GitHub Code Scanning'
    required: false
    default: 'gh-stats'
  comment-pr:
    description: 'Post or update a sticky summary comment on the Pull Request conversation'
    required: false
    default: 'false'
  fail-on:
    description: 'Fail the workflow if PR or release SRE risk level meets or exceeds threshold ("CRITICAL", "HIGH", "MEDIUM", "LOW")'
    required: false
    default: ''
  config-path:
    description: 'Path to .gh-stats.yml configuration file (defaults to auto-discovering .gh-stats.yml or .github/.gh-stats.yml)'
    required: false
    default: ''
  export-json:
    description: 'File path to export DORA & SRE metrics in JSON format'
    required: false
    default: ''
  export-webhook:
    description: 'HTTP/HTTPS Webhook endpoint to dispatch DORA & SRE metrics payload'
    required: false
    default: ''
  webhook-secret:
    description: 'HMAC-SHA256 signature secret or Bearer token for webhook dispatch'
    required: false
    default: ''
  max-ci-latency:
    description: 'Maximum acceptable CI check latency in minutes (default 15)'
    required: false
    default: '15'
  fail-on-flaky:
    description: 'Fail workflow if flaky CI checks are detected on the PR'
    required: false
    default: 'false'
  suggested-bump:
    description: 'Calculate and output recommended next Semantic Version bump and version string'
    required: false
    default: 'false'
  publish-release-notes:
    description: 'Publish or update GitHub release notes with the generated SRE release summary'
    required: false
    default: 'false'
  release-tag:
    description: 'Target release tag for publishing release notes (auto-detected if omitted)'
    required: false
    default: ''
  token:
    description: 'GitHub token for API access or SARIF upload'
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file'
    value: ${{ steps.run-stats.outputs.sarif-file }}
  metrics-json:
    description: 'Path to the exported metrics JSON file (if export-json is enabled)'
    value: ${{ steps.run-stats.outputs.metrics-json }}
  flaky-checks-count:
    description: 'Number of flaky CI check runs detected on the PR'
    value: ${{ steps.run-stats.outputs.flaky-checks-count }}
  ci-latency-seconds:
    description: 'Total cumulative duration of all CI check runs in seconds'
    value: ${{ steps.run-stats.outputs.ci-latency-seconds }}
  release-base-ref:
    description: 'Base ref used for release comparison'
    value: ${{ steps.run-stats.outputs.release-base-ref }}
  release-head-ref:
    description: 'Head ref used for release comparison'
    value: ${{ steps.run-stats.outputs.release-head-ref }}
  release-commits-count:
    description: 'Total number of commits in the release delta'
    value: ${{ steps.run-stats.outputs.release-commits-count }}
  release-breaking-count:
    description: 'Total number of breaking changes and database migrations detected in the release delta'
    value: ${{ steps.run-stats.outputs.release-breaking-count }}
  release-risk-level:
    description: 'Calculated deployment risk level for the release ("LOW", "MEDIUM", "HIGH", "CRITICAL")'
    value: ${{ steps.run-stats.outputs.release-risk-level }}
  release-risk-score:
    description: 'Calculated deployment risk score for the release (0-100)'
    value: ${{ steps.run-stats.outputs.release-risk-score }}
  suggested-bump:
    description: 'Recommended Semantic Version bump type ("major", "minor", "patch")'
    value: ${{ steps.run-stats.outputs.suggested-bump }}
  suggested-version:
    description: 'Recommended next Semantic Version string (e.g. "v0.5.0")'
    value: ${{ steps.run-stats.outputs.suggested-version }}
  release-id:
    description: 'ID of the published or updated GitHub Release'
    value: ${{ steps.run-stats.outputs.release-id }}
  release-url:
    description: 'HTML URL of the published or updated GitHub Release'
    value: ${{ steps.run-stats.outputs.release-url }}
  target:
    description: 'Resolved target mode (pr, repo, or release)'
    value: ${{ steps.run-stats.outputs.target }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22'
        cache: false

    - name: Run gh-stats
      id: run-stats
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_BASE_REF: ${{ inputs.base-ref != '' && inputs.base-ref || github.base_ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_SARIF_OUTPUT: ${{ inputs.output }}
        INPUT_COMMIT_LIMIT: ${{ inputs.commit-limit }}
        INPUT_COMMENT_PR: ${{ inputs.comment-pr }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_EXPORT_JSON: ${{ inputs.export-json }}
        INPUT_EXPORT_WEBHOOK: ${{ inputs.export-webhook }}
        INPUT_WEBHOOK_SECRET: ${{ inputs.webhook-secret }}
        INPUT_MAX_CI_LATENCY: ${{ inputs.max-ci-latency }}
        INPUT_FAIL_ON_FLAKY: ${{ inputs.fail-on-flaky }}
        INPUT_SUGGEST_BUMP: ${{ inputs.suggested-bump }}
        INPUT_PUBLISH_RELEASE_NOTES: ${{ inputs.publish-release-notes }}
        INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        go run "${{ github.action_path }}/cmd/gh-stats"

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: ${{ inputs.category }}
        token: ${{ inputs.token }}
