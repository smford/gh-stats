name: "Release & Publish"

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "pkg/**"
      - "action.yml"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".gh-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: "Semantic Version & Release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Test Suite
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Calculate Semantic Version with gh-stats
        id: semver
        run: |
          go run ./cmd/gh-stats --target=release --suggest-bump

      - name: Check If Code Changes Require Release
        if: steps.semver.outputs.is_new_version != 'true'
        run: |
          echo "No code changes detected in cmd/, pkg/, go.mod/sum, or action.yml since last release. Skipping release."

      - name: Configure Git User
        if: steps.semver.outputs.is_new_version == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag Release & Update Major Tag
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          NEW_TAG: ${{ steps.semver.outputs.version }}
          MAJOR_TAG: ${{ steps.semver.outputs.major_tag }}
        run: |
          echo "Tagging release: ${NEW_TAG}"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

          if [ -n "${MAJOR_TAG}" ]; then
            echo "Updating floating major tag: ${MAJOR_TAG}"
            git tag -fa "${MAJOR_TAG}" -m "Update ${MAJOR_TAG} to ${NEW_TAG}"
            git push origin "${MAJOR_TAG}" --force
          fi

      - name: Build Cross-Platform Release Assets
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh "${VERSION}" "${COMMIT_SHA:0:7}"

      - name: Publish GitHub Release
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          gh release create "${VERSION}" dist/* \
            --title "gh-stats ${VERSION}" \
            --generate-notes

      - name: Generate and Publish Homebrew Formula
        if: steps.semver.outputs.is_new_version == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ steps.semver.outputs.version }}
          VERSION: ${{ steps.semver.outputs.version_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh "$VERSION" "$TAG_NAME" "dist" "Formula/gh-stats.rb"

          # Upload formula asset to GitHub release
          gh release upload "$TAG_NAME" Formula/gh-stats.rb --clobber

          # Commit updated formula to gh-stats repository
          git add Formula/gh-stats.rb
          git commit -m "chore(formula): update Homebrew formula to ${TAG_NAME} [skip ci]" || true
          git push origin main || true

          # Publish to smford/homebrew-tap if HOMEBREW_TAP_GITHUB_TOKEN is configured
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated formula to smford/homebrew-tap..."
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Formula
            cp Formula/gh-stats.rb tap_repo/Formula/gh-stats.rb
            cd tap_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/gh-stats.rb
            if git diff --staged --quiet; then
              echo "Formula in tap is already up to date"
            else
              git commit -m "feat(formula): update gh-stats to ${TAG_NAME}"
              git push "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" main
              echo "Successfully pushed formula update to smford/homebrew-tap"
            fi
            cd ..
            rm -rf tap_repo
          else
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN secret is not set or is empty."
            echo "::warning::The formula was NOT pushed to smford/homebrew-tap."
            echo "::warning::Add the HOMEBREW_TAP_GITHUB_TOKEN secret in GitHub repo Settings > Secrets and variables > Actions."
          fi
