name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer bump type (auto-detected from conventional commits if set to auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit SemVer version (e.g. v1.0.0). Overrides bump type.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Generate SemVer Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Verify Quality & Run Tests
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Calculate SemVer Version
        id: semver
        shell: bash
        run: |
          git fetch --tags --force

          # Find latest SemVer tag matching v*.*.*
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
          echo "Latest existing tag: ${LATEST_TAG:-none}"

          # Avoid duplicate release if current commit is already tagged
          if [ -n "$LATEST_TAG" ]; then
            TAG_COMMIT=$(git rev-list -n 1 "$LATEST_TAG")
            CURRENT_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
              echo "Commit $CURRENT_COMMIT is already tagged as $LATEST_TAG. Skipping release."
              echo "skip_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          CUSTOM="${{ github.event.inputs.custom_version }}"
          BUMP="${{ github.event.inputs.bump }}"

          if [ -n "$CUSTOM" ]; then
            [[ "$CUSTOM" =~ ^v ]] || CUSTOM="v${CUSTOM}"
            NEW_TAG="$CUSTOM"
            TAG_NUM="${NEW_TAG#v}"
            IFS="." read -r MAJOR MINOR PATCH <<< "$TAG_NUM"
            MAJOR_TAG="v${MAJOR}"
          elif [ -z "$LATEST_TAG" ]; then
            # Initial release
            COMMITS=$(git log HEAD --pretty=format:"%s%n%b")
            if echo "$COMMITS" | grep -Eq "^[a-zA-Z]+(\([^\)]+\))?!:|BREAKING CHANGE:"; then
              MAJOR=1; MINOR=0; PATCH=0
            elif echo "$COMMITS" | grep -Eq "^feat(\([^\)]+\))?:"; then
              MAJOR=0; MINOR=1; PATCH=0
            else
              MAJOR=0; MINOR=0; PATCH=1
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            MAJOR_TAG="v${MAJOR}"
          else
            # Increment from existing tag
            TAG_NUM="${LATEST_TAG#v}"
            IFS="." read -r MAJOR MINOR PATCH <<< "$TAG_NUM"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b")

            if [ "$BUMP" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif [ "$BUMP" = "patch" ]; then
              PATCH=$((PATCH + 1))
            else
              # Auto-detect from conventional commit history
              if echo "$COMMITS" | grep -Eq "^[a-zA-Z]+(\([^\)]+\))?!:|BREAKING CHANGE:"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMITS" | grep -Eq "^feat(\([^\)]+\))?:"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
            fi

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            MAJOR_TAG="v${MAJOR}"
          fi

          echo "Computed new SemVer tag: $NEW_TAG (floating major: $MAJOR_TAG)"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "major_tag=${MAJOR_TAG}" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"

      - name: Build Cross-Platform CLI Binaries
        if: steps.semver.outputs.skip_release != 'true'
        shell: bash
        env:
          NEW_TAG: ${{ steps.semver.outputs.new_tag }}
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for p in "${platforms[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            output_name="dist/gh-stats-${NEW_TAG}-${os}-${arch}${ext}"
            echo "🔨 Compiling ${output_name}..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.version=${NEW_TAG}" \
              -o "$output_name" ./cmd/gh-stats
          done

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum gh-stats-* > checksums.txt
          else
            shasum -a 256 gh-stats-* > checksums.txt
          fi
          cd ..

      - name: Create and Push Git Tags
        if: steps.semver.outputs.skip_release != 'true'
        shell: bash
        env:
          NEW_TAG: ${{ steps.semver.outputs.new_tag }}
          MAJOR_TAG: ${{ steps.semver.outputs.major_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Tagging ${NEW_TAG}..."
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"

          echo "Updating floating major tag ${MAJOR_TAG}..."
          git tag -fa "${MAJOR_TAG}" -m "Update ${MAJOR_TAG} to ${NEW_TAG}"

          git push origin "${NEW_TAG}"
          git push origin "${MAJOR_TAG}" --force

      - name: Publish GitHub Release
        if: steps.semver.outputs.skip_release != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.semver.outputs.new_tag }}
        run: |
          echo "🚀 Publishing GitHub Release ${NEW_TAG}..."
          gh release create "${NEW_TAG}" \
            dist/* \
            --title "Release ${NEW_TAG}" \
            --generate-notes
